<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>Student List</h2>

    <!-- 🔙 Back Button -->
    <a href="/dashboard">
        <button style="margin-bottom:15px;">⬅ Back to Dashboard</button>
    </a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>
                <!-- ✏ Edit Button -->
                <a href="/update/{{ student[0] }}">
                    <button>Edit</button>
                </a>

                <!-- 🗑 Delete Button -->
                <a href="/delete/{{ student[0] }}"
                   onclick="return confirm('Are you sure you want to delete this student?');">
                    <button style="background:red;">Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
